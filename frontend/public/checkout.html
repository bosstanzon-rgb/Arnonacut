<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ArnonaCut — secure checkout for the Preparation Kit." />
    <title>ArnonaCut — Checkout</title>
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/tailwind.css" />
  </head>
  <body class="mesh-hero min-h-screen font-sans text-slate-800">
    <header class="border-b border-slate-200/70 bg-white/85 backdrop-blur-xl">
      <div class="mx-auto flex max-w-lg items-center justify-between gap-3 px-4 py-3.5 sm:max-w-xl rtl:flex-row-reverse">
        <a href="/" class="flex items-center gap-3 rounded-xl outline-none transition hover:opacity-95 focus-visible:ring-2 focus-visible:ring-brand-400/40">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-600 via-brand-500 to-forest-500 text-xs font-bold text-white shadow-glow ring-2 ring-white/25">AC</span>
          <span class="text-sm font-semibold text-slate-900" data-i18n="brand.name">ArnonaCut</span>
        </a>
        <div
          class="flex shrink-0 items-center gap-0.5 rounded-full border border-slate-200/80 bg-slate-50/90 p-1 shadow-sm"
          id="checkout-lang-bar"
          role="group"
          data-i18n-aria="meta.ariaLanguage"
        ></div>
      </div>
    </header>

    <main class="mx-auto max-w-lg px-4 pb-20 pt-8 sm:max-w-xl sm:pt-10">
      <p class="text-center text-[11px] font-bold uppercase tracking-widest text-brand-800/90" data-i18n="disclaimer.paywall"></p>

      <div class="mt-8 overflow-hidden rounded-[1.75rem] border border-white/60 bg-white/90 shadow-premium backdrop-blur-xl">
        <div class="relative bg-gradient-to-br from-brand-800 via-brand-700 to-brand-900 px-7 py-10 text-white">
          <div class="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full bg-brand-400/20 blur-3xl" aria-hidden="true"></div>
          <p class="relative text-xs font-bold uppercase tracking-widest text-brand-100/90" id="checkout-kit-label"></p>
          <p id="checkout-price-hero" class="relative mt-3 text-4xl font-bold tabular-nums tracking-tight sm:text-5xl"></p>
          <p class="relative mt-4 text-sm leading-relaxed text-brand-50/95" data-i18n="checkout.subtitle"></p>
          <div
            class="relative mt-5 rounded-xl border border-amber-300/50 bg-amber-950/25 px-4 py-3 text-start shadow-inner ring-1 ring-amber-200/20"
            role="status"
          >
            <p class="text-sm font-bold text-amber-100" data-i18n="checkout.urgencyTitle"></p>
            <p class="mt-1.5 text-xs font-medium leading-relaxed text-amber-50/95" data-i18n="checkout.urgencyBody"></p>
          </div>
        </div>

        <div class="border-b border-slate-100 bg-gradient-to-r from-forest-50 to-emerald-50/80 px-7 py-5">
          <div class="flex items-start gap-4">
            <span
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-forest-500 to-forest-600 text-lg text-white shadow-md"
              aria-hidden="true"
              >✓</span
            >
            <div>
              <p class="text-sm font-bold text-emerald-950" data-i18n="checkout.guaranteeTitle"></p>
              <p class="mt-1.5 text-xs leading-relaxed text-emerald-900/90" data-i18n="checkout.guaranteeBody"></p>
            </div>
          </div>
        </div>

        <div class="px-7 py-8">
          <p class="text-sm font-bold text-slate-900" data-i18n="checkout.includesTitle"></p>
          <ul class="mt-5 space-y-3.5 text-sm text-slate-700">
            <li class="flex gap-3">
              <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-forest-100 text-xs font-bold text-forest-700" aria-hidden="true">✓</span>
              <span data-i18n="checkout.i1"></span>
            </li>
            <li class="flex gap-3">
              <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-forest-100 text-xs font-bold text-forest-700" aria-hidden="true">✓</span>
              <span data-i18n="checkout.i2"></span>
            </li>
            <li class="flex gap-3">
              <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-forest-100 text-xs font-bold text-forest-700" aria-hidden="true">✓</span>
              <span data-i18n="checkout.i3"></span>
            </li>
            <li class="flex gap-3">
              <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-forest-100 text-xs font-bold text-forest-700" aria-hidden="true">✓</span>
              <span data-i18n="checkout.i4"></span>
            </li>
            <li class="flex gap-3">
              <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-forest-100 text-xs font-bold text-forest-700" aria-hidden="true">✓</span>
              <span data-i18n="checkout.i5"></span>
            </li>
          </ul>

          <div class="mt-8 flex flex-wrap items-center justify-center gap-4 rounded-2xl border border-trust-100 bg-trust-50/60 px-4 py-3 text-center">
            <div class="flex items-center gap-2 text-[11px] font-semibold text-trust-800">
              <svg class="h-4 w-4 text-trust-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
              <span data-i18n="checkout.trustSeal"></span>
            </div>
          </div>

          <div class="mt-8 rounded-2xl border border-slate-200/90 bg-slate-50/70 p-5 ring-1 ring-slate-100/80">
            <p class="text-sm font-bold text-slate-900" data-i18n="checkout.compareTitle"></p>
            <p class="mt-1 text-xs leading-relaxed text-slate-600" data-i18n="checkout.compareSub"></p>
            <div class="mt-4 grid gap-3 sm:grid-cols-2">
              <div class="rounded-xl border border-slate-200 bg-white/90 p-4">
                <p class="text-[11px] font-bold uppercase tracking-wide text-slate-500" data-i18n="landing.compareFreeBadge"></p>
                <ul class="mt-3 space-y-2 text-xs leading-relaxed text-slate-700">
                  <li class="flex gap-2"><span class="font-bold text-forest-600" aria-hidden="true">✓</span><span data-i18n="landing.compareFree1"></span></li>
                  <li class="flex gap-2"><span class="font-bold text-forest-600" aria-hidden="true">✓</span><span data-i18n="landing.compareFree2"></span></li>
                  <li class="flex gap-2"><span class="font-bold text-forest-600" aria-hidden="true">✓</span><span data-i18n="landing.compareFree3"></span></li>
                </ul>
              </div>
              <div class="rounded-xl border-2 border-brand-300/80 bg-gradient-to-b from-brand-50 to-white p-4 shadow-sm">
                <p class="text-[11px] font-bold uppercase tracking-wide text-brand-800" data-i18n="landing.comparePremiumBadge"></p>
                <ul class="mt-3 space-y-2 text-xs leading-relaxed text-slate-800">
                  <li class="flex gap-2"><span class="font-bold text-brand-600" aria-hidden="true">✓</span><span data-i18n="landing.comparePremium1"></span></li>
                  <li class="flex gap-2"><span class="font-bold text-brand-600" aria-hidden="true">✓</span><span data-i18n="landing.comparePremium2"></span></li>
                  <li class="flex gap-2"><span class="font-bold text-brand-600" aria-hidden="true">✓</span><span data-i18n="landing.comparePremium3"></span></li>
                </ul>
              </div>
            </div>
          </div>

          <p class="mt-6 rounded-2xl border border-slate-100 bg-slate-50/90 px-4 py-3 text-xs leading-relaxed text-slate-600 ring-1 ring-slate-100/80" data-i18n="checkout.placeholderNote"></p>

          <details class="mt-6 rounded-2xl border border-amber-200/70 bg-amber-50/50 p-4 ring-1 ring-amber-100/80">
            <summary class="cursor-pointer text-xs font-bold text-amber-950" data-i18n="legal.fullDisclaimerDetailsSummary"></summary>
            <div id="checkout-legal-full-body" class="mt-3 max-h-[min(28rem,50vh)] overflow-y-auto border-t border-amber-200/60 pt-3"></div>
            <p class="mt-2 text-[11px] leading-relaxed text-amber-900/85">
              <a href="/disclaimers.html" class="font-semibold text-brand-800 underline decoration-brand-300 underline-offset-2" data-i18n="legal.standaloneLinkText"></a>
            </p>
          </details>

          <div class="mt-8 flex flex-col gap-3">
            <button
              type="button"
              id="checkout-pay-btn"
              data-i18n-aria="checkout.payAria"
              class="w-full min-h-[54px] rounded-2xl bg-gradient-to-r from-forest-600 via-forest-500 to-brand-500 py-4 text-base font-bold text-white shadow-glow transition hover:brightness-[1.04] active:scale-[0.99] focus:outline-none focus-visible:ring-2 focus-visible:ring-forest-400 focus-visible:ring-offset-2 disabled:opacity-80"
            ></button>
            <p id="checkout-error" role="alert" aria-live="assertive" class="hidden text-center text-sm font-medium text-rose-700"></p>
          </div>

          <a
            href="/"
            class="mt-8 flex w-full min-h-[48px] items-center justify-center rounded-xl border border-slate-200 bg-white py-3 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-slate-300 hover:bg-slate-50"
            data-i18n="checkout.back"
          ></a>
        </div>
      </div>
    </main>

    <footer class="border-t border-slate-200/80 bg-white/90 py-10 backdrop-blur-md">
      <div class="mx-auto max-w-lg px-4 text-center text-xs text-slate-600 sm:max-w-xl sm:text-start">
        <p class="leading-relaxed" data-i18n="disclaimer.footer"></p>
        <p class="mt-4 font-bold uppercase tracking-wide text-slate-500" data-i18n="footer.legalHeading"></p>
        <nav class="mt-2 flex flex-wrap justify-center gap-x-5 gap-y-1 sm:justify-start" aria-label="Legal">
          <a href="/disclaimers.html" class="font-semibold text-trust-600 underline decoration-trust-200 underline-offset-2" data-i18n="footer.disclaimers"></a>
          <a href="/privacy.html" class="font-semibold text-trust-600 underline decoration-trust-200 underline-offset-2" data-i18n="footer.privacy"></a>
          <a href="/terms.html" class="font-semibold text-trust-600 underline decoration-trust-200 underline-offset-2" data-i18n="footer.terms"></a>
        </nav>
        <p class="mt-4 text-xs text-slate-600">
          <span data-i18n="meta.contact"></span>:
          <a href="mailto:bosstanzon@gmail.com" class="font-semibold text-brand-700 underline decoration-brand-300 underline-offset-2">bosstanzon@gmail.com</a>
        </p>
      </div>
    </footer>

    <script src="/assets/js/i18n.js" defer></script>
    <script src="/assets/js/legal.js" defer></script>
    <script src="/assets/js/checkout.js" defer></script>
  </body>
</html>
